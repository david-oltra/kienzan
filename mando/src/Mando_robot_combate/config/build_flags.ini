; config/build_flags.ini
;
; Configuración de build_flags para el entorno esp32doit-devkit-v1.
; Se carga desde platformio.ini mediante [platformio] extra_configs.
;
; IMPORTANTE: el nombre de la sección debe coincidir EXACTAMENTE con el
; nombre del entorno definido en platformio.ini. Si defines build_flags
; aquí, esta sección SOBRESCRIBE las build_flags del mismo nombre en
; platformio.ini.

[env:esp32doit-devkit-v1]
build_flags =
    ; --- Log y chequeo de errores ---
    -DCORE_DEBUG_LEVEL=3
    -DESP_ERR_CHECK_ENABLE

    ; --- LVGL: ruta explícita al lv_conf.h del proyecto ---
    ; Sin comillas dobles y con ${PROJECT_DIR} entre llaves.
    ; PlatformIO sustituye ${PROJECT_DIR} por la ruta absoluta del proyecto
    ; en tiempo de build, y esa ruta se pasa al compilador como cadena
    ; sin espacios. NO hace falta rodearla de comillas.
    -DLV_CONF_PATH=${PROJECT_DIR}/include/lv_conf.h

    ; --- LVGL: incluir lvgl.h con ruta simple (lo usa lvgl_esp32_drivers) ---
    -DLV_LVGL_H_INCLUDE_SIMPLE

    ; --- LVGL: resolución lógica del display ---
    -DLV_HOR_RES_MAX=240
    -DLV_VER_RES_MAX=280

    ; --- LVGL: driver ST7789 por SPI ---
    -DCONFIG_LV_TFT_DISPLAY_CONTROLLER_ST7789
    -DCONFIG_LV_TFT_DISPLAY_PROTOCOL_SPI
    -DCONFIG_LV_TFT_DISPLAY_SPI3_HOST
    -DCONFIG_LV_DISP_SPI_MOSI=23
    -DCONFIG_LV_DISP_SPI_CLK=18
    -DCONFIG_LV_DISP_PIN_DC=17
    -DCONFIG_LV_DISP_PIN_RST=5
    -DCONFIG_LV_DISPLAY_USE_SPI_CS
    -DCONFIG_LV_DISP_SPI_CS=16
    -DCONFIG_LV_DISP_USE_RST

    ; --- LVGL: touch deshabilitado ---
    -DCONFIG_LV_TOUCH_CONTROLLER_NONE
    -DCONFIG_LV_PREDEFINED_DISPLAY_NONE

    ; --- LVGL: orientación y offsets del panel ---
    -DCONFIG_LV_DISPLAY_ORIENTATION=0
    -DCONFIG_LV_INVERT_COLORS
    -DCONFIG_LV_TFT_DISPLAY_OFFSETS
    -DCONFIG_LV_TFT_DISPLAY_X_OFFSET=20
    -DCONFIG_LV_TFT_DISPLAY_Y_OFFSET=0

    ; --- ADC: silenciar warnings de la API legacy ---
    -DCONFIG_ADC_ONESHOT_ISR_IRAM_SAFE