; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Carga la configuración de build_flags desde un archivo externo.
; Todas las flags de LVGL, ADC y logs viven en config/build_flags.ini
extra_configs =
    config/build_flags.ini

[env:esp32doit-devkit-v1]
; Plataforma 6.5.0 → trae ESP-IDF 5.1.2 y el toolchain correcto (GCC 12.2)
; NO subir a ^6.9.0 sin cambiar también el framework: el toolchain 14.2
; de plataformas recientes es incompatible con el newlib de IDF 5.1.
platform = espressif32 @ 6.5.0
board = esp32doit-devkit-v1
framework = espidf
monitor_speed = 115200
; upload_speed = 921600

; --- Flash ---
board_build.flash_size = 4MB
board_build.partitions = partitions_custom.csv

; Decodifica backtraces y añade timestamp a cada línea del monitor serie
monitor_filters = esp32_exception_decoder, time

lib_deps =
    lvgl/lvgl@^8.4.0

; NOTA: build_src_filter NO es compatible con framework = espidf.
; Si algún día necesitas excluir archivos del build, se hace en
; src/CMakeLists.txt, no aquí.